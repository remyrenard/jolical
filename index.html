<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title><!--TITLE--></title>
<!-- Application installable (PWA) : manifeste, icônes, nom « Jolical » sur l'écran d'accueil ; couleur de la barre = fond de la page s'il est réglé (posée par le serveur) -->
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon.svg" type="image/svg+xml"><link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><meta name="theme-color" content="#32ad95">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="{{app.name}}"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* =====================================================================
   1. VARIABLES
   Chaque famille d'éléments a 7 réglages (Paramètres > Apparence) :
     --X-fg texte · --X-bg fond · --X-bo opacité du fond · --X-bc bordure · --X-bw épaisseur · --X-br radius · --X-sh ombre
   X = g (Général : menu latéral, cadres) · b (Boutons) · c (Calendriers : semaines, mois, mini) · p (Pop-up) · f (Champs)
   ===================================================================== */
:root{--tabw0:34px;--cc1:#8e44ad;--cc2:#27ae60;--cc3:#2980b9;--bg:#fff;--fg:#1c2025;--acc:#4f8cff;--fs:14px;--dn:3px;--wgap:6px;--calpad:12px;--calpadm:4px;--hr:10px;--evr:4px;--evpad:2px;--ppad:18px;--blur:4px;
 --tt:30px;--st:12px;--today:#e74c3c;--todayfg:#fff;--mute:#9aa3ad;--mutehd:#fff;--muteop:.55;--recop:.7;--shd:#0004;--shs:12px;--ovl:#0007;--grpo:0%;--ev-sh:none;
 --sepw:1px;--sepop:100%;--extop:30%;--vac:#f6d365;--hol:#f5a3a3;
 /* Luminosité (évènements, pastilles) : mélange avec blanc (+) ou noir (−) · --X-lm = blanc/noir, --X-lp = pourcentage */
 --bigr:4px;--ev-lm:white;--ev-lp:0%;--dot-lm:white;--dot-lp:0%;--dotsz:80%;--evfg:#fff;
 /* Survol : --X-hm = couleur mélangée au survol (blanc, noir, couleur principale ou transparent = aucun), --X-hp = intensité
    X = b Boutons · c Calendriers · e Évènements · d En-têtes des jours · t Tâches · f Champs · g Général */
 --b-hm:black;--b-hp:10%;--c-hm:var(--acc);--c-hp:18%;--g-hm:var(--acc);--g-hp:18%;--e-hm:transparent;--e-hp:0%;--d-hm:transparent;--d-hp:0%;
 --t-hm:transparent;--t-hp:0%;--f-hm:transparent;--f-hp:0%;
 /* Bouton principal : facteur de taille ; --fabh = place réservée en bas des vues pour ne pas masquer la dernière ligne */
 /* Animations : --ak = facteur de vitesse (0,42 rapide · 0,65 modérée · 1 lente) ; --akp = ouverture des pop-up, une vitesse plus lente (0,65 · 1 · 1,54) ;
    courbes « ouverture » / « fermeture » / « apparition » / « translation » ;
    --thc / --tl / --td / --tf / --tg = durées (couleurs au survol, soulèvement, pastilles, bouton principal, menus ; 0s = animation désactivée) ;
    --po0 / --ps0 = opacité / échelle de départ des pop-up. Chaque durée a une valeur ici : une variable non définie rendrait invalide toute la déclaration « transition » */
 --ak:1;--akp:calc(var(--ak)*1.54);--e-open:cubic-bezier(.19,.13,.49,1.12);--e-close:cubic-bezier(.25,-.25,.8,1);--e-pop:cubic-bezier(.18,.89,.32,1.2);--e-lift:cubic-bezier(.18,.89,.32,1);
 --thc:0s;--tl:0s;--td:0s;--tf:0s;--tg:0s;--po0:0;--ps0:.92;--dotk:1.25;
 --fabk:1;--fabh:calc(var(--fabk)*56px + 24px);
 --g-bo:100%;--g-bw:1px;--g-br:10px;--g-sh:0 0 0 transparent;--b-bo:100%;--b-bw:1px;--b-br:10px;--b-sh:0 0 0 transparent;--c-bo:100%;--c-bw:1px;--c-br:10px;--c-sh:0 0 0 transparent;
 --p-bo:100%;--p-bw:1px;--p-br:10px;--p-sh:0 0 0 transparent;--f-bo:100%;--f-bw:1px;--f-br:10px;--f-sh:0 0 0 transparent}
@media(prefers-color-scheme:dark){:root{--bg:#1b1f23;--fg:#e6e8eb}}
:root{--pan:color-mix(in srgb,var(--bg) 94%,var(--fg));--line:color-mix(in srgb,var(--bg) 85%,var(--fg));--mut:color-mix(in srgb,var(--fg) 55%,var(--bg));
 --sbg:var(--pan);--grp:var(--pan);
 --tc:var(--fg);--sc:var(--mut);--danger:color-mix(in srgb,#e74c3c 22%,var(--bg));--donec:var(--acc)}
/* ===== 2. BASE ===== */
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:var(--fs) var(--fx,system-ui,sans-serif);background:var(--bg);color:var(--fg);display:flex;height:100vh}
/* Casse (Titres et textes) : titres = titre principal + titre de l'aperçu d'une journée ; sous-titres = sections du menu latéral et des Paramètres.
   « Majuscule au premier mot » = texte tel quel + 1re lettre en majuscule (::first-letter) ; « à chaque mot » = capitalize */
#title,#dd .dtitle{text-transform:var(--cast,none)}#title::first-letter,#dd .dtitle::first-letter{text-transform:var(--cast1,uppercase)}
:is(h4.fold,h4.cat-h)>span{text-transform:var(--cass,uppercase)}:is(h4.fold,h4.cat-h)>span::first-letter{text-transform:var(--cass1,uppercase)}
/* calendriers = noms des mois (vue Année, mini-calendrier) + en-têtes des jours de la vue Mois */
.mh,.mnav span,.week .dh{text-transform:var(--casc,lowercase)}:is(.mh,.mnav span,.week .dh)::first-letter{text-transform:var(--casc1,lowercase)}
h1,h3,.mh,#sidetitle{font-family:var(--ft,var(--fx,system-ui,sans-serif));color:var(--tc)}
/* couleurs des titres : --tc = page (titre principal, volet, noms des mois) · --tcp = panneaux (Paramètres : Apparence, Connexions…) · --tcd = pop-up (titres, champ titre) */
.set h3{color:var(--tcp,var(--tc))}:is(dialog h3,#t,#tk-t){color:var(--tcd,var(--tc))}
h4.fold,h4.cat-h,.fab,.row button,#dd .plusrow button,.dh,button.sm{font-family:var(--fsb,var(--fx,system-ui,sans-serif))}
button,input,select,textarea{font:inherit;padding:6px 10px}
/* Boutons */
/* Couleurs de base d'un bouton : --bb fond, --bt texte, --bl bordure (le survol les modifie, cf. section 8) */
button{--bb:color-mix(in srgb,var(--b-bg,var(--bg)) var(--b-bo),transparent);--bt:var(--b-fg,currentColor);--bl:var(--b-bc,var(--line));
 color:var(--bt);background:var(--bb);border:var(--b-bw) solid var(--bl);border-radius:var(--b-br);box-shadow:var(--b-sh);cursor:pointer}
/* boutons de menus (‹ Aujourd'hui ›, onglets des vues, + Tâche) : « Couleur du texte / de fond (menus) » (--bm-fg / --bm-bg), sinon couleurs des boutons ; onglet actif : couleur principale */
:is(#prev,#today,#next,.tab,.tkadd button):not(.on){--bb:color-mix(in srgb,var(--bm-bg,var(--b-bg,var(--bg))) var(--b-bo),transparent);--bt:var(--bm-fg,var(--b-fg,currentColor))}
button.on,button.pri{--bb:var(--acc);--bl:var(--acc);--bt:#fff}
button.danger{--bb:var(--danger);--bt:var(--dangerfg,var(--b-fg,currentColor));--bl:var(--dangerbc,var(--b-bc,var(--line)))}
button:disabled{opacity:.55;cursor:default;--bb:color-mix(in srgb,var(--b-bg,var(--bg)) var(--b-bo),transparent)}button.pri:disabled{--bt:var(--b-fg,var(--fg))}   /* bouton principal grisé : texte lisible */
button.sm{padding:3px 10px;font-size:12px}button.rnd{padding:0}
/* Focus (clavier, ouverture d'un pop-up) : couleur principale ; boutons rouges : couleur de leur bordure (rouge par défaut) */
*{-webkit-tap-highlight-color:transparent}   /* iPad / iPhone : pas de carré sombre au toucher */
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}button.danger:focus-visible{outline-color:var(--dangerbc,#e74c3c)}
/* Champs */
input:not([type=checkbox]):not([type=range]),select,textarea{--fb:color-mix(in srgb,var(--f-bg,var(--bg)) var(--f-bo),transparent);--fl:var(--f-bc,var(--line));color:var(--f-fg,inherit);background:var(--fb);border:var(--f-bw) solid var(--fl);border-radius:var(--f-br);box-shadow:var(--f-sh)}
/* Liste ouverte d'un menu déroulant (PC) : fond normal d'un champ, même si le menu est survolé */
select option{background:color-mix(in srgb,var(--f-bg,var(--bg)) var(--f-bo),var(--bg));color:var(--f-fg,var(--fg))}
input[type=checkbox],input[type=range]{accent-color:var(--acc)}input[type=checkbox]{padding:0}
.ico{width:1em;height:1em;display:block}.rnd{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center}.rnd .ico{width:52%;height:52%}.rnd.sm{width:26px;height:26px}
.tab .ico{width:1.2em;height:1.2em}
/* Onglets à picto (Anniversaires, Paramètres) : ronds, de la hauteur de l'onglet « Mois » (--tabih, mesurée par tabSize() dans app.js), picto centré ;
   gâteau remonté de 0,18 em : le bas du dessin s'aligne sur le bas des lettres de « Mois » / « Année » */
.tabs .tab[data-ico]{width:var(--tabih,auto);height:var(--tabih,auto);padding:0;border-radius:50%;display:inline-grid;place-items:center}.tab[data-v="bday"] .ico{transform:translateY(-.18em)}
/* ===== 3. MENU LATÉRAL (Général) ===== */
/* Volet : replié = décalé hors de l'écran (marge négative sur ordinateur : le contenu se resserre en même temps ; translation sur mobile) */
/* fond prolongé de 60 px à gauche (ombre pleine) : rien ne se voit derrière quand l'animation « dépasse » */
aside{--sw:280px;--tabw:34px;--tabh:48px;--asbg:color-mix(in srgb,var(--sbg) var(--g-bo),transparent);width:var(--sw);margin-left:0;background:var(--asbg);color:var(--g-fg,var(--fg));border-right:var(--g-bw) solid var(--g-bc,var(--line));box-shadow:-60px 0 0 var(--asbg),var(--g-sh);flex:none;position:relative;z-index:2;display:flex;flex-direction:column;padding:0}
.side-in{flex:1;min-height:0;overflow:auto;padding:0 20px 12px}   /* seul l'intérieur défile (sous le titre) : la barre de défilement commence au mini-calendrier, la languette peut dépasser du volet */
aside>.sh{flex:none;padding:12px 20px 0}
aside label{line-height:1.2em}body.closed aside{margin-left:calc(-1*var(--sw));visibility:hidden}
/* Languette du volet : collée au bord droit (par-dessus la bordure), carrée à gauche, arrondie à droite, couleur du volet, 34 × 48 px, à 11 px du haut ;
   double chevron « (volet ouvert) qui pivote en » (volet fermé, courbe propre à la fermeture) ; survol : elle s'allonge de 5 px */
#burger{position:absolute;left:100%;top:11px;width:var(--tabw);height:var(--tabh);visibility:visible;padding:0 12px 0 0;display:flex;align-items:center;justify-content:flex-end;
 background:var(--asbg);color:var(--g-fg,var(--fg));border:var(--g-bw) solid var(--g-bc,var(--line));border-left:0;border-radius:0 999px 999px 0;box-shadow:var(--g-sh);clip-path:inset(-40px -40px -40px 0);transition:width var(--tl,0s) var(--e-pop)}
#burger:hover{background:var(--asbg);color:var(--g-fg,var(--fg));border-color:var(--g-bc,var(--line))}
#burger .ico{width:22px;height:22px;flex:none;transition:transform calc(.45s*var(--ak,1)) var(--e-pop)}body.closed #burger .ico{transform:rotate(-180deg);transition:transform calc(.35s*var(--ak,1)) cubic-bezier(.19,.13,.49,1.12)}
@media(hover:hover){#burger:hover{width:calc(var(--tabw) + 5px)}}
body.wide header .left{margin-left:max(0px,calc(var(--tabw0) + 8px - 12px))}   /* écran large : ‹ Aujourd'hui › décalé de la largeur de la languette */
.sh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
/* Outils : liens vers les applications Nextcloud, même style que les calendriers (.cal : fond qui réagit au survol), picto avant le texte */
#tools a.cal{color:inherit;text-decoration:none;cursor:pointer}#tools a .ico{width:14px;height:14px;opacity:.7;flex:none}.sh b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;font-weight:600}
h4.fold,h4.cat-h{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;margin:16px 0 6px;font-size:var(--st);color:var(--sc)}
.fold span,.cat-h span{flex:1}.fold i,.cat-h i{width:12px;height:12px;transition:transform var(--tg) ease}.fold i .ico,.cat-h i .ico{width:100%;height:100%}.shut i{transform:rotate(-90deg)}
/* Engrenage des options des tâches : pas un bouton (couleur du titre, pas de fond) ; zoom au survol (--gs), rotation quand le menu-bulle s'ouvre / se ferme (.open, --gr) */
.fold button{--bb:transparent;--bl:transparent;--bt:currentColor;padding:0 4px;border:0;box-shadow:none}:is(#tgear,#qgear) .ico{transition:transform var(--tg) var(--e-pop);transform:scale(var(--gs,1)) rotate(var(--gr,0deg))}:is(#tgear,#qgear).open{--gr:30deg}.fold button .ico{width:20px;height:20px}
/* Groupes (Calendriers, Tâches, catégories des paramètres) */
.cat{border:var(--g-bw) solid var(--g-bc,var(--line));border-radius:var(--g-br);background:color-mix(in srgb,var(--grp) var(--grpo),transparent);margin:12px 0;padding:0 14px}
.cat h4.cat-h,.cat h4.fold{margin:0;padding:12px 0}.cat-b{padding-bottom:8px}
.tksep{margin-top:12px}.tksep:first-child{margin-top:2px}   /* tâches classées par liste : nom de la liste */
.calsep{display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-size:11px;color:var(--donec)}.calsep::after{content:'';flex:1;border-top:1px solid var(--donec)}   /* séparateur « Externes » */
.cal,.task{display:flex;gap:8px;align-items:center;margin:calc(var(--dn)*1.7) 0}.cal{padding:2px 4px;margin-inline:-4px;border-radius:6px}.cal i{width:12px;height:12px;border-radius:50%;flex:none}
#tasks{font-family:var(--fk,var(--fx,system-ui,sans-serif))}
/* Tâches : --tkc couleur du texte, --tka couleur de la case (le survol les modifie) */
.task{--tkc:var(--todoc,var(--g-fg,var(--fg)));--tka:var(--acc)}.task.done{--tkc:var(--donec);--tka:var(--donec)}
/* clic sur le texte d'une tâche modifiable = pop-up tâche ; lecture seule (.ro) : ni clic ni survol */
.task span{flex:1;min-width:0;overflow-wrap:anywhere;margin-left:-4px;color:var(--tkc)}.task:not(.ro) span{cursor:pointer}.tkadd{display:flex;justify-content:flex-end;margin-top:8px}.task small{color:var(--mut)}.task input{accent-color:var(--tka)}
.task.done span{text-decoration:line-through}
#veil{display:none}
/* Pop-up flottants (bulles, options, sélecteur de couleur) */
#tpop,#qpop,#bub,#cp{position:fixed;z-index:6;background:color-mix(in srgb,var(--p-bg,var(--bg)) var(--p-bo),transparent);color:var(--p-fg,var(--fg));border:var(--p-bw) solid var(--p-bc,var(--line));border-radius:var(--p-br);box-shadow:var(--p-sh)}
#tpop,#qpop{width:240px;padding:10px}:is(#tpop,#qpop) label{display:flex;gap:8px;margin:6px 0}#qpop b{display:block;font-size:12px;margin:8px 0 2px;color:var(--mut)}#qpop b:first-child{margin-top:0}
/* ===== 4. ZONE PRINCIPALE & EN-TÊTE =====
   Étroit (par défaut) : ligne 1 = ☰ + titre centré · ligne 2 = navigation (gauche) + vues (droite)
   Large (body.wide, seuil "hdBp" réglable dans Titres et textes) : ☰ + navigation | titre centré | vues, sur une ligne */
main{flex:1;display:flex;flex-direction:column;min-width:0;padding:12px;gap:10px;overflow-x:clip}
header{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:end;gap:8px}
header .left{display:contents}
h1{grid-area:1/1/2/3;text-align:center;margin:0;padding:0 44px;line-height:1.15;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:calc(var(--tt)*1.5);font-weight:600}
.nav,.tabs{display:flex;align-items:end;gap:8px}
.nav{grid-area:2/1;justify-self:start}.tabs{grid-area:2/2;justify-self:end}
body.wide header{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
body.wide header .left{display:flex;align-items:end;gap:8px;grid-area:1/1;justify-self:start}
body.wide h1{grid-area:1/2;padding:0 8px}
body.wide .tabs{grid-area:1/3}
.pane{flex:1;min-height:0;border:var(--g-bw) solid var(--g-bc,var(--line));border-radius:var(--g-br);background:color-mix(in srgb,var(--g-bg,var(--bg)) var(--g-bo),transparent);color:var(--g-fg,var(--fg));overflow:hidden auto;padding:var(--calpad);padding-bottom:calc(var(--calpad) + var(--fabh));box-shadow:var(--g-sh)}
#v-settings{padding:0 0 var(--fabh)}
/* Bouton principal : taille réglable (--fabk), ancré au coin bas-droit (il grandit vers le haut et la gauche) */
.fab{position:fixed;right:24px;bottom:24px;z-index:3;width:calc(56px*var(--fabk));height:calc(56px*var(--fabk));padding:0;display:grid;place-items:center;border-radius:50%;box-shadow:0 calc(var(--shs)/3) var(--shs) var(--shd)}
/* icône du bouton principal : + (évènement) ou ✕ (fermer les paramètres) */
.fab .ico{width:42%;height:42%;transition:transform var(--tf) var(--e-pop)}.fab.x .ico{transform:rotate(-45deg)}   /* + tourné de 45° = × */
/* Languette « Mode hors-ligne » : en bas à gauche, face au bouton principal (même hauteur), arrondie à droite seulement */
#offb{position:fixed;left:0;bottom:24px;z-index:3;height:calc(56px*var(--fabk));display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:1px;padding:0 calc(28px*var(--fabk)) 0 16px;
 border:0;border-radius:0 999px 999px 0;background:color-mix(in srgb,#e74c3c 75%,transparent);color:#fff;text-shadow:0 1px 2px rgb(0 0 0/.35);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));box-shadow:0 calc(var(--shs)/3) var(--shs) var(--shd);text-align:left;line-height:1.2}
#offb[hidden]{display:none}#offb b{font-size:14px}#offb small{font-size:11px;opacity:.9}
#banner{background:#c0392b;color:#fff;padding:6px 12px;border-radius:var(--g-br)}
/* ===== 5. VUE MOIS =====
   Une semaine = grille 7 colonnes x 4 lignes (en-tête, matin, après-midi, soir). Chaque cellule (en-tête ou section)
   est placée DIRECTEMENT dans la grille de la semaine (grid-area posé en JS) : une ligne prend toujours la hauteur
   de la cellule la plus haute, les pointillés sont donc alignés sur les 7 jours, sans dépendre de "subgrid".
   Classes des cellules : .first (lundi) / .last (dimanche) / .out (hors mois) / .td (aujourd'hui) ; data-d="AAAA-MM-JJ".
   Bordure : en-tête (haut/gauche/droite) + sections (gauche/droite ; pointillés en haut ; bas plein sur le soir).
   Coins arrondis de la semaine (radius des calendriers) : haut et bas du lundi et du dimanche. */
#grid{display:flex;flex-direction:column;gap:var(--wgap)}
.week{display:grid;grid-template-columns:var(--wcols,repeat(7,minmax(0,1fr)));grid-template-rows:repeat(4,auto);border-radius:var(--c-br);isolation:isolate}
/* Ombre d'une semaine (Calendriers > Ombre) : couche placée dessous, qui reproduit la forme (7 en-têtes arrondis + corps) ;
   le corps, peint après les en-têtes et de la couleur du panneau, cache leurs ombres vers le bas : seul le contour est ombré */
.wsh{z-index:-1;box-shadow:var(--c-sh);pointer-events:none;cursor:default}.wsh.h{border-radius:var(--hr) var(--hr) 0 0}
.wsh.b{border-radius:0 0 var(--c-br) var(--c-br);background:color-mix(in srgb,var(--g-bg,var(--bg)) var(--g-bo),transparent)}
.week>*{min-width:0;cursor:pointer;container-type:inline-size;color:var(--c-fg,inherit)}.week>:not(.first):not(.wsh){border-left-width:0}   /* bordures jamais superposées (une seule entre deux jours) */
.week>.dh:not(.first),.wsh.h:not(.h0){border-left-width:var(--c-bw);margin-left:calc(-1*var(--c-bw))}   /* en-têtes arrondis : bordure gauche conservée (sinon le coin s'amincit jusqu'à disparaître), posée sur la bordure droite du voisin */
.week>.out{border-color:color-mix(in srgb,var(--mut) 50%,transparent)!important}   /* jours hors du mois : bordures grises, à moitié */
.week>.out{opacity:var(--muteop)}
.week>.sec.aft{border-left-width:var(--c-bw);margin-left:calc(-1*var(--c-bw))}   /* 1er jour du mois après un jour hors du mois : sa propre bordure gauche (couleur normale), posée sur la bordure grisée du voisin */
.dh{padding:3px 6px;font-size:var(--st);color:#fff;text-align:center;white-space:nowrap;border:var(--c-bw) solid var(--c-bc,var(--line));border-bottom:0;border-radius:var(--hr) var(--hr) 0 0}
/* En-têtes : police "fontHead" (sinon sous-titres), taille "sizeHead" (sinon sous-titres), réduite par fitHeads() si un texte ne tient pas (--hsfit) */
.week .dh{background:var(--hb);font-family:var(--fh,var(--fsb,var(--fx,system-ui,sans-serif)));font-size:var(--hsfit,var(--hs,var(--st)));overflow:hidden}
.dh.first{border-top-left-radius:var(--c-br)}.dh.last{border-top-right-radius:var(--c-br)}.dh.td{font-weight:700}

 <!-- Recherche : champ, loupe (lancer), engrenage (options) -->
 <div id="srch"><input id="q" type="search" placeholder="{{search.ph}}" aria-label="{{search.ph}}" maxlength="100" enterkeyhint="search"><button id="qgo" class="sm" title="{{search.go}}" aria-label="{{search.go}}" data-ico="search"></button><button id="qgear" title="{{search.opts}}" aria-label="{{search.opts}}" data-ico="gear"></button></div>
 <div class="cat"><h4 class="fold" data-sec="cal"><span>{{side.cals}}</span><i data-ico="d"></i></h4><div id="cals" class="cat-b"></div></div>
 <div class="cat"><h4 class="fold" data-sec="tasks"><span>{{side.tasks}}</span><button id="tgear" title="{{side.taskOpts}}" data-ico="gear"></button><i data-ico="d"></i></h4><div id="tasks" class="cat-b"></div></div>
 <div class="cat" id="toolsc" hidden><h4 class="fold" data-sec="tools"><span>{{side.tools}}</span><i data-ico="d"></i></h4><div id="tools" class="cat-b"></div></div>
</div>
</aside>
<div id="veil"></div>
<div id="qpop" hidden>
 <b>{{search.in}}</b>
 <label><input type="checkbox" id="q-t"> {{search.inT}}</label>
 <label><input type="checkbox" id="q-l"> {{search.inL}}</label>
 <label><input type="checkbox" id="q-d"> {{search.inD}}</label>
 <label><input type="checkbox" id="q-k"> {{search.inK}}</label>
 <b>{{search.when}}</b>
 <label><input type="checkbox" id="q-f"> {{search.whenF}}</label>
 <label><input type="checkbox" id="q-p"> {{search.whenP}}</label>
</div>
<div id="tpop" hidden>
 <label><input type="checkbox" id="p-done"> {{tasks.showDone}}</label>
 <label><input type="checkbox" id="p-ro"> {{tasks.showRo}}</label>
 <label><input type="checkbox" id="p-dated"> {{tasks.dated}}</label>
 <label><input type="checkbox" id="p-bylist"> {{tasks.byList}}</label>
</div>
<!-- Zone principale -->
<main>
 <!-- En-tête : 2 lignes sur écran étroit, 1 ligne sur écran large (voir CSS section 4) -->
 <header>
  <div class="left">
   <div class="nav" id="nav"><button id="prev" class="rnd" data-ico="l"></button><button id="today">{{btn.today}}</button><button id="next" class="rnd" data-ico="r"></button></div>
  </div>
  <h1 id="title"></h1>
  <div class="tabs" id="tabs"><button class="tab" data-v="month">{{view.month}}</button><button class="tab" data-v="year">{{view.year}}</button><button class="tab" data-v="bday" data-ico="cake" title="{{view.bday}}" aria-label="{{view.bday}}" hidden></button><button class="tab" data-v="settings" title="{{view.settings}}" aria-label="{{view.settings}}" data-ico="gear"></button></div>
 </header>
 <div id="banner" hidden>{{banner.err}}</div>
 <div id="v-month" class="pane"><div id="grid"></div></div>
 <div id="v-year" class="pane" hidden><div id="yearg"></div></div>
 <div id="v-bday" class="pane" hidden><div id="bdg"></div></div>
 <div id="v-settings" class="pane" hidden><div class="set" id="set"></div></div>
</main>
<button id="offb" hidden title="{{offline.btnTitle}}"><b>{{offline.title}}</b><small id="offd"></small></button>
<button id="new" class="pri fab" title="{{fab.new}}" data-ico="plus"></button>
<button id="trash" class="danger" title="{{drag.trash}}" aria-label="{{drag.trashAria}}" data-ico="trash" tabindex="-1" hidden></button>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="bub" hidden></div>
<!-- Sélecteur de couleur maison -->
<div id="cp" hidden><div id="cp-sv"><i id="cp-dot"></i></div><input type="range" id="cp-h" min="0" max="360"><div id="cp-pre"></div></div>
<!-- Pop-up : liste des évènements d'un jour -->
<dialog id="dday"><div class="box" id="dd"></div></dialog>
<!-- Pop-up : résultats de la recherche -->
<dialog id="dsrch"><div class="box" id="ds" tabindex="-1" autofocus></div></dialog>
<!-- Pop-up : aperçu d'un évènement ou d'une tâche -->
<dialog id="dinfo"><div class="box" id="di" tabindex="-1" autofocus></div></dialog>
<!-- Pop-up : messages et confirmations (remplace les alertes du navigateur) -->
<!-- Connexion : mot de passe seul (le nom « calendrier », invisible, aide les trousseaux à enregistrer le mot de passe) -->
<dialog id="dlogin"><form class="box" id="lgf" tabindex="-1" autofocus>
 <p id="lgend" class="lgend" hidden>{{login.ended}}</p>
 <input class="lguser" type="text" name="username" autocomplete="username" value="calendrier" tabindex="-1" aria-hidden="true">
 <div class="lgpw"><input id="lgp" type="password" name="password" autocomplete="current-password" placeholder="{{login.ph}}" aria-label="{{login.aria}}"><button type="button" id="lgeye" title="{{login.show}}" aria-pressed="false"></button></div>
 <p id="lgerr" class="lgerr" role="alert"></p>
 <div class="row lgrow"><button class="pri" id="lgok">{{btn.ok}}</button></div>
</form></dialog>
<dialog id="dmsg"><div class="box" id="dm" tabindex="-1" autofocus></div></dialog>
<!-- Pop-up : raccourcis clavier (touche ?) -->
<dialog id="dkeys"><div class="box" id="dk" tabindex="-1" autofocus></div></dialog>
<!-- Pop-up : créer / modifier un évènement -->
<!-- Évènement : champs de base (titre, calendrier, dates, rappels, lieu) ; « + d'options » : statut, tags, répétition, description.
     Mode anniversaire (form.bmode) : seulement le nom, la date, « Année inconnue » et les rappels (.nb = masqué dans ce mode) -->
<dialog id="dlg"><form id="f" class="box" tabindex="-1" autofocus>
 <!-- groupes séparés par un espace plus grand ; .opt = masqué tant que « + d'options » n'est pas déplié (création) -->
 <div class="grp"><input id="t" required placeholder="{{ev.titlePh}}">
  <div class="fl1 nb" id="cw">{{ev.cal}}<div class="selw"><i id="cdot"></i><select id="c"></select></div></div></div>
 <div class="grp nb opt"><div class="fl1">{{ev.status}}<div class="pills seg" id="st"><button type="button" class="pill" data-s="CONFIRMED">{{ev.st.CONFIRMED}}</button><button type="button" class="pill" data-s="TENTATIVE">{{ev.st.TENTATIVE}}</button><button type="button" class="pill" data-s="CANCELLED">{{ev.st.CANCELLED}}</button></div></div>
  <div class="fl1" id="tgw">{{ev.tags}}<div class="pills" id="tg"></div></div></div>
 <div class="grp"><div class="two"><label><span id="slab">{{ev.start}}</span><input id="s" type="datetime-local" required></label><label class="nb">{{ev.end}}<input id="e" type="datetime-local" required></label><label class="bonly aday"><input type="checkbox" id="by"> {{bday.noYear}}</label></div>
  <label class="nb aday"><input type="checkbox" id="a"> {{date.allDay}}</label>
  <!-- Répétition : fréquence ; jours (semaines) ; « tous les N … » + fin -->
  <div class="opt nb"><div class="rr">{{ev.repeat}}<select id="rf"><option value="">{{rr.opt.none}}</option><option value="DAILY">{{rr.opt.DAILY}}</option><option value="WEEKLY">{{rr.opt.WEEKLY}}</option><option value="MONTHLY">{{rr.opt.MONTHLY}}</option><option value="YEARLY">{{rr.opt.YEARLY}}</option><option value="custom" hidden>{{rr.opt.custom}}</option></select></div>
  <div class="rr" id="rdw"><div class="pills" id="rd"></div></div>
  <div class="rr" id="rew"><span id="rint">{{rr.every}} <span class="num"><input id="ri" type="number" min="1" max="99" value="1"><span class="spin"><button type="button" data-n="1" title="{{num.plus}}" aria-label="{{num.plus}}"></button><button type="button" data-n="-1" title="{{num.minus}}" aria-label="{{num.minus}}"></button></span></span> <span id="riu">{{rr.unit.DAILY.n}}</span></span><select id="re"><option value="">{{rr.end.never}}</option><option value="until">{{rr.end.until}}</option><option value="count">{{rr.end.count}}</option></select><input id="ru" type="date"><span id="rcw"><span class="num"><input id="rc" type="number" min="1" max="999" value="10"><span class="spin"><button type="button" data-n="1" title="{{num.plus}}" aria-label="{{num.plus}}"></button><button type="button" data-n="-1" title="{{num.minus}}" aria-label="{{num.minus}}"></button></span></span> {{rr.times}}</span></div>
  <p id="rnote" class="hint" hidden></p></div></div>
 <div class="grp"><div id="rems"></div><p id="remhint" class="hint" hidden></p></div>
 <div class="grp nb"><div class="fl1 nb" id="lw">{{ev.loc}}<input id="l"></div>
  <div class="opt"><label>{{ev.desc}}<textarea id="d" rows="3"></textarea></label></div></div>
 <p id="note" class="muted" hidden>{{ev.roNote}}</p>
 <div class="row"><button type="button" id="cancel">{{btn.cancel}}</button><button type="button" id="del" class="danger">{{btn.del}}</button><button type="button" id="moreb" class="nb">{{ev.more}}</button><button class="pri" id="ok">{{btn.save}}</button></div>
</form></dialog>
<!-- Pop-up : créer / modifier une tâche -->
<dialog id="dtk"><form id="ft" class="box" tabindex="-1" autofocus>
 <div class="tkh"><input type="checkbox" id="tk-done" title="{{task.done}}"><input id="tk-t" required placeholder="{{task.new}}"></div>
 <label>{{task.list}}<div class="selw"><i id="tk-dot"></i><select id="tk-c"></select></div></label>
 <label><input type="checkbox" id="tk-hd"> {{task.due}}</label>
 <label id="tk-dw" hidden>{{task.dueDate}}<input id="tk-due" type="date"></label>
 <div class="row"><button type="button" id="tk-cancel">{{btn.cancel}}</button><button type="button" id="tk-del" class="danger">{{btn.del}}</button><button class="pri" id="tk-ok">{{btn.addNew}}</button></div>
</form></dialog>
<!--TEXTS--><script src="/app.js"></script></body></html>
